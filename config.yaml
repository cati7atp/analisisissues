# Quantum GitHub Issues Analysis Configuration

# Paths
paths:
  raw_data: "data/raw/issues.jsonl"           # Input: JSONL with issues + comments
  processed_data: "data/processed/issues_clean.jsonl"
  topics_output: "data/analysis/topics.jsonl"
  doc_topics_output: "data/analysis/doc_topics.jsonl"
  patterns_output: "data/analysis/quantum_patterns.jsonl"
  metrics_output: "data/analysis/maintainability_metrics.json"
  metrics_csv: "reports/maintainability_summary.csv"
  model_dir: "models/bertopic"
  visualization_html: "reports/topic_visualization.html"
  report_md: "reports/quantum_maintainability_report.md"
  pattern_summary_csv: "reports/pattern_summary.csv"
  cache_dir: "data/cache"                     # embeddings .npy cache

# Input (read-only SQLite dataset)
input:
  db_path: "quantum-gh-dataset-2026-10-22/miner.db"
  item_types: [issue]            # Phase 1: issues only (values: issue, pr, discussion)
  include_comment_kinds: [issue_comment]
  exclude_repos: ["QuTech-Delft/OpenQL"]
  max_reject_ratio: 0.005

# Preprocessing
preprocessing:
  bot_users: ["dependabot", "renovate", "github-actions", "codecov", "coveralls", "bors", "mergify",
              "qiskit-bot", "CLAassistant", "pre-commit-ci", "codecov-commenter", "stale"]  # exact names; also author_type=Bot and "[bot]" suffix
  # Case-sensitive, per-line regexes for template comments (never free substrings)
  automated_comment_patterns:
    - '^This issue has been automatically marked as stale\b.*$'
    - '^Thank you for your submission, we really appreciate it\. Like many open source projects.*$'
  min_body_length: 10
  min_chars: 30                  # drop issues with fewer cleaned title+body characters; 0 disables
  max_comment_length: 50000
  strip_code_fences: true
  strip_templates: true          # HTML comments and template headings (checklist lines go through the repeated-line filter)
  repeated_line_min_issues: 20   # remove lines seen in this many distinct issues (two-pass); 0 disables
  repeated_comment_min_issues: 5 # drop comments seen in this many distinct issues; 0 disables
  drop_exact_duplicates: true    # keep the first of identical (normalized) title+body documents
  normalize_whitespace: true

# BERTopic Configuration
bertopic:
  embedding_model: "all-MiniLM-L6-v2"
  nr_topics: null                    # null = auto, or integer to reduce
  embed_max_chars: 2000              # embedded text = title + first N chars of body (no comments)
  embed_batch_size: 64
  embed_device: null                 # null = auto
  embed_normalize: true
  umap_n_neighbors: 15
  umap_n_components: 5
  umap_min_dist: 0.0
  umap_metric: "cosine"
  hdbscan_min_cluster_size: 30           # unvalidated starting value (S18); tune on the first real run
  hdbscan_min_samples: 10                # unvalidated starting value
  hdbscan_metric: "euclidean"
  vectorizer_ngram_range: [1, 2]
  vectorizer_stop_words: "english"
  vectorizer_min_df: 1
  vectorizer_max_df: 0.85            # fraction of topics (c-TF-IDF fits one doc per topic)
  domain_stop_words: ["code", "block", "url", "user", "issue", "code_block", "build_log"]  # placeholder tokens left by clean_text
  noise_lexicon: ["macosx", "aarch64", "ranlib", "travis", "dependabot", "tagbot", "appveyor", "manylinux", "x86_64",
                  "ccache", "cmake", "gcc", "wheel", "wheels", "pip", "ubuntu", "circleci", "jenkins", "github actions",
                  "workflow", "linux", "darwin", "msvc", "conda", "toolchain", "distutils", "msvccompiler"]  # S20: >= 3 of a topic's top-10 keywords here marks it as noise
  calculate_probabilities: false      # probabilities come from hdbscan.probabilities_
  temporal_views: true               # topics_over_time is slow (tens of minutes on ~35k issues); false skips it
  reduce_outliers: false             # true also writes *_reduced outputs; the primary result is never reduced
  seed: 42                           # UMAP random_state
  reproducible: true                 # true: seeded single-threaded UMAP (same topics every run); false: parallel, unseeded
  verbose: true

# Maintainability Metrics
metrics:
  compute_gini: true
  resolution_time_quantiles: [0.25, 0.5, 0.75]
  anonymize_repos_in_report: true

# Reporting
report:
  include_visualizations: true
  max_example_quotes: 3
  quote_max_length: 200
  anonymize: true

# Cross-project patterns: a topic that recurs in several distinct repos
cross_project:
  min_repos: 3
  min_issues_per_repo: 3
  max_top_repo_share: 0.9
