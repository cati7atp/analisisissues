# Configuración del análisis de issues cuánticos de GitHub

# Rutas
paths:
  raw_data: "data/raw/issues.jsonl"           # Entrada: JSONL con issues + comentarios
  processed_data: "data/processed/issues_clean.jsonl"
  topics_output: "data/analysis/topics.jsonl"
  doc_topics_output: "data/analysis/doc_topics.jsonl"
  patterns_output: "data/analysis/quantum_patterns.jsonl"
  metrics_output: "data/analysis/maintainability_metrics.json"
  metrics_csv: "reports/maintainability_summary.csv"
  model_dir: "models/bertopic"
  visualization_html: "reports/topic_visualization.html"
  report_md: "reports/quantum_maintainability_report.md"
  pattern_summary_csv: "reports/pattern_summary.csv"
  cache_dir: "data/cache"                     # caché .npy de embeddings

# Entrada (dataset SQLite de solo lectura)
input:
  db_path: "quantum-gh-dataset-2026-10-22/miner.db"
  item_types: [issue]            # Fase 1: solo issues (valores: issue, pr, discussion)
  include_comment_kinds: [issue_comment]
  exclude_repos: ["QuTech-Delft/OpenQL"]
  max_reject_ratio: 0.005

# Preprocesamiento
preprocessing:
  bot_users: ["dependabot", "renovate", "github-actions", "codecov", "coveralls", "bors", "mergify",
              "qiskit-bot", "CLAassistant", "pre-commit-ci", "codecov-commenter", "stale"]  # nombres exactos; también author_type=Bot y el sufijo "[bot]"
  # Regex por línea que distinguen mayúsculas, para comentarios de plantilla (nunca subcadenas libres)
  automated_comment_patterns:
    - '^This issue has been automatically marked as stale\b.*$'
    - '^Thank you for your submission, we really appreciate it\. Like many open source projects.*$'
  min_body_length: 10
  min_chars: 30                  # descarta issues con menos caracteres de título+cuerpo limpios; 0 lo desactiva
  max_comment_length: 50000
  strip_code_fences: true
  strip_templates: true          # comentarios HTML y encabezados de plantilla (las líneas de checklist pasan por el filtro de líneas repetidas)
  repeated_line_min_issues: 20   # elimina líneas vistas en esta cantidad de issues distintos (dos pasadas); 0 lo desactiva
  repeated_comment_min_issues: 5 # descarta comentarios vistos en esta cantidad de issues distintos; 0 lo desactiva
  drop_exact_duplicates: true    # conserva el primero de los documentos idénticos (normalizados) de título+cuerpo
  normalize_whitespace: true
  anonymize_authors: true        # las personas pasan a ser pseudónimos con sal (u_<12 hex>); el filtro de bots usa primero el nombre real
  author_salt: "quantum-issues"  # cámbiala para que los pseudónimos no se puedan vincular con una publicación anterior

# Configuración de BERTopic
bertopic:
  embedding_model: "all-MiniLM-L6-v2"
  nr_topics: null                    # null = automático, o un entero para reducir
  embed_max_chars: 2000              # texto embebido = título + primeros N caracteres del cuerpo (sin comentarios)
  embed_batch_size: 64
  embed_device: null                 # null = auto
  embed_normalize: true
  umap_n_neighbors: 15
  umap_n_components: 5
  umap_min_dist: 0.0
  umap_metric: "cosine"
  hdbscan_min_cluster_size: 30           # valor inicial sin validar (S18); ajústalo en la primera corrida real
  hdbscan_min_samples: 10                # valor inicial sin validar
  hdbscan_metric: "euclidean"
  vectorizer_ngram_range: [1, 2]
  vectorizer_stop_words: "english"
  vectorizer_min_df: 1
  vectorizer_max_df: 0.85            # fracción de temas (c-TF-IDF ajusta un documento por tema)
  domain_stop_words: ["code", "block", "url", "user", "issue", "code_block", "build_log"]  # tokens marcadores que deja clean_text
  noise_lexicon: ["macosx", "aarch64", "ranlib", "travis", "dependabot", "tagbot", "appveyor", "manylinux", "x86_64",
                  "ccache", "cmake", "gcc", "wheel", "wheels", "pip", "ubuntu", "circleci", "jenkins", "github actions",
                  "workflow", "linux", "darwin", "msvc", "conda", "toolchain", "distutils", "msvccompiler"]  # S20: si >= 3 de las 10 palabras clave principales de un tema están aquí, se marca como ruido
  calculate_probabilities: false      # las probabilidades vienen de hdbscan.probabilities_
  temporal_nr_bins: 10
  temporal_views: true               # topics_over_time es lento con ~35k issues (minutos); false lo omite
  reduce_outliers: true              # true también escribe salidas *_reduced; el resultado principal nunca se reduce
  seed: 42                           # random_state de UMAP
  reproducible: true                 # true: UMAP con semilla y un solo hilo (mismos temas en cada corrida); false: paralelo, sin semilla
  verbose: true

# Métricas de mantenibilidad
metrics:
  compute_gini: true
  resolution_time_quantiles: [0.25, 0.5, 0.75]
  anonymize_repos_in_report: true

# Reportes
report:
  include_visualizations: true
  max_example_quotes: 3
  quote_max_length: 200
  anonymize: true

# Patrones entre proyectos: un tema que se repite en varios repos distintos
cross_project:
  min_repos: 3
  min_issues_per_repo: 3
  max_top_repo_share: 0.9
