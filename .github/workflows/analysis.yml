name: Quantum Issues Analysis

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      data_artifact:
        description: 'Name of an artifact holding miner.db (leave empty to run tests only)'
        required: false
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  analysis:
    needs: tests
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.data_artifact != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.data_artifact }}
          path: dataset/
      - name: Run analysis pipeline
        run: |
          sed -i 's#^  db_path:.*#  db_path: "dataset/miner.db"#' config.yaml
          python -m src.cli run-pipeline --config config.yaml
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            reports/
            data/analysis/
