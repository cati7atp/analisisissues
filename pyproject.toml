[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-issues-analysis"
version = "0.1.0"
description = "Analyze GitHub issues from quantum software repositories to identify maintainability patterns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer==0.12.5",
    "click<8.2",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "pyyaml==6.0.1",
    "structlog==24.1.0",
    "rich==13.7.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "scikit-learn==1.5.0",
    "sentence-transformers==3.0.1",
    "bertopic==0.16.3",
    "umap-learn==0.5.6",
    "hdbscan==0.8.40",
    "plotly==5.22.0",
    "matplotlib==3.9.0",
    "tqdm==4.66.4",
    "python-dateutil==2.9.0.post0",
    "regex==2024.7.24",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.6",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[project.scripts]
quantum-issues = "src.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "T201"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true